{% extends "base.html" %}
{% block title %}New Test{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>New Test</h2>
        <div class="card p-4 mt-3">
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Test name *</label>
                    <input name="test_name" class="form-control" required autofocus
                           placeholder="e.g. Biology Mid-Term 2026">
                </div>
                <button class="btn btn-primary">Create</button>
                <a href="{{ url_for('teacher.home') }}" class="btn btn-link">Cancel</a>
            </form>
        </div>
        <p class="text-muted small mt-2">After creating, you'll be taken to the question editor.</p>
    </div>
</div>
{% endblock %}
