{% extends "base.html" %}
{% block title %}Login &middot; AI Sheet Evaluator{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card mt-5">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">
                    <i class="bi bi-mortarboard-fill text-primary"></i>
                    AI Sheet Evaluator
                </h3>
                <p class="text-muted text-center">Log in with your account.</p>

                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input name="username" type="text" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input name="password" type="password" class="form-control" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Log in</button>
                </form>

                <hr>
                <div class="small text-muted">
                    <strong>Demo accounts (from seed.py):</strong><br>
                    admin / admin123 &nbsp;&middot;&nbsp;
                    teacher1 / teacher123 &nbsp;&middot;&nbsp;
                    student1 / student123
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
